# Segurança do Apache para o WordPress da GILDA;
# Local: montado em /etc/apache2/conf-enabled/ pelo docker-compose.
# Produção (Apache): copiar para a config do vhost ou adaptar para .htaccess (ver docs/development/deploy.md).

# Não anunciar versão do Apache/SO
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<Directory "/var/www/html">
    Options -Indexes

    # Arquivos que só revelam versão ou não deveriam ser públicos
    <FilesMatch "^(readme\.html|license\.txt|licen[cs]a\.txt|wp-config-sample\.php|readme\.txt|README\.md|changelog\.txt|CHANGELOG\.md|composer\.(json|lock)|package(-lock)?\.json|phpcs\.xml(\.dist)?)$">
        Require all denied
    </FilesMatch>

    # Logs, dumps e backups
    <FilesMatch "\.(log|sql|sql\.gz|bak|old|orig|save|swp|dist|ini|sh)$|~$">
        Require all denied
    </FilesMatch>

    # Arquivos ocultos (.git, .env, .htpasswd...), exceto .well-known
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
</Directory>

# Configuração e instalador do WordPress
<Files "wp-config.php">
    Require all denied
</Files>
<Directory "/var/www/html/wp-admin">
    <Files "install.php">
        Require all denied
    </Files>
    <Files "setup-config.php">
        Require all denied
    </Files>
</Directory>

# Nunca executar PHP enviado por upload
<Directory "/var/www/html/wp-content/uploads">
    <FilesMatch "\.(php[0-9]?|phtml|phar|pht|phps|cgi|pl|py|sh)$">
        Require all denied
    </FilesMatch>
    php_admin_flag engine off
</Directory>

# wp-includes: PHP interno não é acessado diretamente
<Directory "/var/www/html/wp-includes">
    <FilesMatch "\.php$">
        Require all denied
    </FilesMatch>
    # exceções usadas pelo front/admin
    <FilesMatch "^(ms-files|wp-tinymce|js/tinymce/wp-tinymce)\.php$">
        Require all granted
    </FilesMatch>
</Directory>
<Directory "/var/www/html/wp-includes/js/tinymce">
    <FilesMatch "^wp-tinymce\.php$">
        Require all granted
    </FilesMatch>
</Directory>
