# Ambiente local do site GILDA; (WordPress + WooCommerce)
#
# Core do WordPress, plugins de terceiros e uploads ficam no volume `wp_core`
# (rápido e fora do git). Da pasta do projeto só entra o NOSSO código:
# mu-plugins (e, quando existirem, o tema e plugins próprios).

x-wp-env: &wp-env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_NAME: ${DB_NAME}
  WORDPRESS_DB_USER: ${DB_USER}
  WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
  SMTP_HOST: mailpit
  SMTP_PORT: 1025
  MAIL_FROM: loja@mundogilda.test
  STORE_ADDRESS: ${STORE_ADDRESS:-}
  STORE_CITY: ${STORE_CITY:-}
  STORE_STATE: ${STORE_STATE:-}
  STORE_CEP: ${STORE_CEP:-}
  META_PIXEL_ID: ${META_PIXEL_ID:-}
  META_PIXEL_DEBUG: ${META_PIXEL_DEBUG:-}
  # Mesmo wp-config para o site e para o WP-CLI (os dois precisam saber que é "local").
  WORDPRESS_DEBUG: 1
  WORDPRESS_CONFIG_EXTRA: |
    define( 'WP_ENVIRONMENT_TYPE', 'local' );
    define( 'WP_DEBUG_LOG', '/tmp/wp-debug.log' ); // fora da pasta pública
    define( 'WP_DEBUG_DISPLAY', false );

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "${WP_PORT:-8080}:80"
    environment: *wp-env
    volumes:
      - wp_core:/var/www/html
      - ./wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./wp-content/themes/gilda:/var/www/html/wp-content/themes/gilda # tema do K1venn
      - ./config/apache/gilda-security.conf:/etc/apache2/conf-enabled/zz-gilda-security.conf:ro
      - ./config/php/gilda.ini:/usr/local/etc/php/conf.d/zz-gilda.ini:ro

  mailpit:
    image: axllent/mailpit:v1.34.0
    restart: unless-stopped
    ports:
      - "${MAIL_PORT:-8026}:8025"

  phpmyadmin:
    image: phpmyadmin:5
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "${PMA_PORT:-8081}:80"
    environment:
      PMA_HOST: db

  wpcli:
    image: wordpress:cli-php8.3
    profiles: ["cli"]
    user: "33:33"
    depends_on:
      - wordpress
    environment: *wp-env
    volumes:
      - wp_core:/var/www/html
      - ./wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./wp-content/themes/gilda:/var/www/html/wp-content/themes/gilda
      - ./scripts:/scripts:ro
      - ./data:/data:ro
      - ./backups:/backups

volumes:
  db_data:
  wp_core:
